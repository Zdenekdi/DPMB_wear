[project]
name = "dpmb-server"
version = "0.1.0"
description = "Odjezdy IDS JMK pro hodinky DPMB Wear z otevřených dat KORDIS JMK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "gtfs-realtime-bindings>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dpmb-server = "dpmb_server.app:main"

[tool.setuptools]
packages = ["dpmb_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
